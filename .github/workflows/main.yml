name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行一次
  workflow_dispatch:      # 允许你手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync from Upstream
        uses: wei/pull@v1
        with:
          url: https://github.com/gslege/CloudflareIP
          head: main
          base: main
